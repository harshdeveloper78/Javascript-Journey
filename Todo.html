<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <style>
.done {
    text-decoration: line-through;
}
</style>
</head>
<body>
    
    <input type="text" id="text" placeholder="enter the text">
    <button id="button">Add</button>
    <ul id="list"></ul>
    <script>
        //added all three in the js 
        const text = document.getElementById('text');
        const button = document.getElementById('button');
        const list = document.getElementById('list');

        window.onload = function () {
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

            tasks.forEach(task => {
                const li = document.createElement("li");
                li.innerText = task;

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";

                checkbox.onchange = function () {
                    li.classList.toggle("done");
                };

                const delBtn = document.createElement("button");
                delBtn.innerText = "Delete";

                delBtn.addEventListener("click", function () {
                    deleteitem(li, task);
                });

                li.prepend(checkbox);
                li.appendChild(delBtn);
                list.appendChild(li);
            });
        };


        //the li created and the input was taken by user
        function addtext (){
            const li = document.createElement("li"); 
            li.innerText = text.value;

            const checkbox = document.createElement("input");
                checkbox.type = "checkbox";

                checkbox.onchange = function () {
                    li.classList.toggle("done");
                };

            // it is the delete button for deleting the task
            const delBtn = document.createElement("Button");
            delBtn.innerText = "Delete";

            //function for the delete button event 
            delBtn.addEventListener("click", function (){
                deleteitem(li , text.value);

                

                
        });
            // it adds the li in ul 
            li.prepend(checkbox);
            li.appendChild(delBtn);
            list.appendChild(li);

            const tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            tasks.push(text.value);
            localStorage.setItem("tasks", JSON.stringify(tasks));
    } 

            function deleteitem (li, task){
            list.removeChild(li);

            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            tasks = tasks.filter(t => t !== task);
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }


        button.addEventListener('click', addtext);

    </script>
</body>
</html>
